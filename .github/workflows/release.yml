# Publishes to npm when you publish a GitHub Release (Releases → Draft a new release → tag vX.Y.Z → Publish).
# The tag must match the version in package.json.
#
# First release: uses the NPM_TOKEN repository secret.
# After that: set up Trusted Publishing on npmjs.com (package → Settings → Trusted publisher →
# GitHub Actions, owner ayushbeyond, repo atelier-fx, workflow release.yml), then delete the
# NPM_TOKEN secret. npm then trusts this workflow directly and no token is needed.
name: Release
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted Publishing needs npm 11.5 or newer.
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
